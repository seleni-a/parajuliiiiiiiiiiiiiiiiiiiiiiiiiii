<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>૮₍ • ᴥ • ₎ა · 𐂯 · · ฅ՞•ﻌ•՞ฅ)</title>
    <style>
        /* CSS para centrar y manejar el cursor */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: sans-serif;
            flex-direction: column;
        }
        #contenedor-animacion {
            position: relative;
            width: 400px; 
            height: 400px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            border-radius: 10px;
            overflow: hidden;
        }
        #contenedor-animacion img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
        }
        /* Texto Azul */
        #instruccion-texto {
            color: blue;
            margin-top: 15px;
            font-weight: bold;
        }
        /* ESTILO PARA LA EXPLOSIÓN */
        #explosion-effect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            display: none;
            z-index: 10;
        }
    </style></head><body><div id="contenedor-animacion">
    <img id="gif-interactivo" src="poster.png" alt="Haz clic para iniciar la sorpresa">
    
    <img id="explosion-effect" src="explosion.gif" alt="Efecto de Explosión">

    <audio id="musica-base" src="musicabase.wav" loop preload="auto"></audio>
    
    <audio id="sonido-clic" src="sonido-click.wav" preload="auto"></audio>

    <audio id="sonido-loop-gif" src="sonido-loop-gif.wav" loop preload="auto"></audio></div><p id="instruccion-texto">
    (Hacer cliccccccc en el "?" )</p><script>
    // ----------------------------------------------------------------------
    // LÓGICA JAVASCRIPT (VERSION V16 - FINAL CON EXPLOSIÓN Y ROTACIÓN PURA)
    // ----------------------------------------------------------------------
    
    // OBTENER ELEMENTOS
    const gifElement = document.getElementById('gif-interactivo');
    const explosionElement = document.getElementById('explosion-effect'); // NUEVO
    const musicaBase = document.getElementById('musica-base');
    const sonidoClic = document.getElementById('sonido-clic');
    const gifLoopSound = document.getElementById('sonido-loop-gif');

    // ESTADO Y FUENTES DE ARCHIVOS
    let estaAnimando = false;
    const srcPoster = 'poster.png';
    const srcGif = 'animacion.gif';                  
    const srcFinal = 'PNG FINAL.png'; 

    // LÓGICA DE ROTACIÓN AVANZADA
    const masterFrameList = [
        '2.png', '3.png', '4.png', '5.png', '6.png', 
        '7.png', '8.png', '9.png', '10.png', '11.png' 
    ];

    let surpriseQueue = [];
    // Contador: El PNG Final aparecerá después de 10 clics de sorpresa (un solo ciclo)
    let totalFramesShown = 0; 
    
    // Función de ayuda para mezclar la lista (Fisher-Yates Shuffle)
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[i], array[j]];
        }
        return array;
    }

    // Inicializar la cola de sorpresas al cargar la página
    surpriseQueue = shuffle([...masterFrameList]);
    
    // FUNCIÓN PARA ACTIVAR EL EFECTO DE EXPLOSIÓN
    function triggerExplosion() {
        explosionElement.style.display = 'block';
        
        setTimeout(() => {
            explosionElement.style.display = 'none';
        }, 500); // Se muestra por medio segundo
    }


    // EVENTO PRINCIPAL: Clic/Tap
    gifElement.addEventListener('click', function() {
        
        // 1. INICIAR LA MÚSICA DE FONDO (Obligatorio al primer clic del navegador)
        if (musicaBase.paused) {
            musicaBase.play().catch(error => console.error('Error al reproducir música base:', error));
        }

        // 2. LÓGICA PRINCIPAL (Play / Random Frame)
        if (!estaAnimando) {
            // A. ACCIÓN: INICIAR LA ANIMACIÓN (PLAY)
            
            gifElement.src = srcGif;
            gifLoopSound.play().catch(error => console.error('Error al reproducir loop del GIF:', error));
            estaAnimando = true;

        } else {
            // B. ACCIÓN: DETENER / MOSTRAR FRAME ALEATORIO O FINAL
            
            // Si ya se mostraron 10 frames (un ciclo completo)
            if (totalFramesShown >= 10) {
                
                // Mostrar el PNG Final
                gifElement.src = srcFinal;
                
                // Detener interacción y sonidos
                gifLoopSound.pause();
                gifLoopSound.currentTime = 0; 
                sonidoClic.currentTime = 0;
                sonidoClic.play().catch(error => console.error('Error al reproducir sonido de clic:', error));
                
                // Desactivar futuros clics después del final
                gifElement.removeEventListener('click', arguments.callee);
                gifElement.style.cursor = 'default';
                
            } else {
                // Lógica de Rotación Aleatoria Única
                
                // 1. Si la cola está vacía, rellenar y mezclar
                if (surpriseQueue.length === 0) {
                    surpriseQueue = shuffle([...masterFrameList]);
                }

                // 2. Obtener un índice aleatorio del array QUE QUEDA 
                const randomIndex = Math.floor(Math.random() * surpriseQueue.length);

                // 3. Seleccionar el frame y quitarlo del array (Rotación Única)
                const randomFrame = surpriseQueue.splice(randomIndex, 1)[0];
                gifElement.src = randomFrame; 
                
                // 4. Activar el efecto de explosión
                triggerExplosion();
                
                // 5. Incrementar el contador total
                totalFramesShown++; 
                
                // 6. Detener sonidos y actualizar estado
                gifLoopSound.pause();
                gifLoopSound.currentTime = 0; 
                sonidoClic.currentTime = 0;
                sonidoClic.play().catch(error => console.error('Error al reproducir sonido de clic:', error));
                
                estaAnimando = false;
            }
        }
    });</script></body></html>
