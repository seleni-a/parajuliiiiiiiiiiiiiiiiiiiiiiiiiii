<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regalo Interactivo Besti (FINAL)</title>
    <style>
        /* CSS para centrar y manejar el cursor */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: sans-serif;
            flex-direction: column;
        }
        #contenedor-animacion {
            position: relative;
            width: 400px; 
            height: 400px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            border-radius: 10px;
            overflow: hidden;
        }
        #contenedor-animacion img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
        }
        /* [1. CORRECCIÓN DE ESTILO] Texto Azul */
        #instruccion-texto {
            color: blue;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="contenedor-animacion">
    <img id="gif-interactivo" src="primer-cuadro-gif.PNG" alt="Haz clic para iniciar la sorpresa">
    
    <audio id="musica-base" src="musica-fondo.MP3" loop preload="auto"></audio>
    <audio id="sonido-clic" src="sonido-click.MP3" preload="auto"></audio>
    <audio id="sonido-loop-gif" src="sonido-loop-gif.MP3" loop preload="auto"></audio>
</div>

<p id="instruccion-texto">
    (Hacer cliccccccc en el "?" )
</p>

<script>
    // ----------------------------------------------------------------------
    // LÓGICA JAVASCRIPT (VERSION FINAL CON ROTACIÓN AVANZADA)
    // ----------------------------------------------------------------------
    
    // OBTENER ELEMENTOS
    const gifElement = document.getElementById('gif-interactivo');
    const musicaBase = document.getElementById('musica-base');
    const sonidoClic = document.getElementById('sonido-clic');
    const gifLoopSound = document.getElementById('sonido-loop-gif');

    // ESTADO Y FUENTES DE ARCHIVOS
    let estaAnimando = false;
    const srcPoster = 'primer-cuadro-gif.PNG';
    const srcGif = 'tu-animacion.GIF';                  
    // [2. NUEVO] Nombre del PNG final
    const srcFinal = 'PNG_FINAL.PNG'; 

    // LÓGICA DE ROTACIÓN AVANZADA (Shuffle and Exhaust)
    // Master list de frames (no se modifica)
    const masterFrameList = [
        '2.PNG', '3.PNG', '4.PNG', '5.PNG', '6.PNG', 
        '7.PNG', '8.PNG', '9.PNG', '10.PNG', '11.PNG' 
    ];

    // Cola de frames por mostrar (se vacía y se rellena)
    let surpriseQueue = [];

    // Contador de frames mostrados (para la condición del PNG Final)
    // El PNG final se muestra cuando totalFramesShown llegue a 20 (dos ciclos completos).
    let totalFramesShown = 0; 
    
    // Función de ayuda para mezclar la lista (Fisher-Yates Shuffle)
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // Inicializar la cola de sorpresas al cargar la página
    surpriseQueue = shuffle([...masterFrameList]);

    // EVENTO PRINCIPAL: Clic/Tap
    gifElement.addEventListener('click', function() {
        
        // 1. INICIAR LA MÚSICA DE FONDO (Solo ocurre una vez al primer clic)
        if (musicaBase.paused) {
            musicaBase.play().catch(error => console.error('Error al reproducir música base:', error));
        }

        // 2. LÓGICA PRINCIPAL (Play / Random Frame)
        if (!estaAnimando) {
            // A. ACCIÓN: INICIAR LA ANIMACIÓN (PLAY)
            
            gifElement.src = srcGif;
            gifLoopSound.play().catch(error => console.error('Error al reproducir loop del GIF:', error));
            estaAnimando = true;

        } else {
            // B. ACCIÓN: DETENER / MOSTRAR FRAME ALEATORIO O FINAL
            
            // [2. CONDICIÓN FINAL] Si ya se mostraron 20 frames (dos ciclos completos)
            if (totalFramesShown >= 20) {
                
                // Mostrar el PNG Final
                gifElement.src = srcFinal;
                
                // Detener todos los sonidos de interacción
                gifLoopSound.pause();
                gifLoopSound.currentTime = 0; 
                sonidoClic.currentTime = 0;
                sonidoClic.play().catch(error => console.error('Error al reproducir sonido de clic:', error));
                
                // Opcional: Desactivar futuros clics después del final
                gifElement.removeEventListener('click', arguments.callee);
                gifElement.style.cursor = 'default';
                
            } else {
                // Lógica de Rotación Aleatoria Sin Repetición
                
                // 1. Si la cola está vacía, rellenar y mezclar (inicia un nuevo ciclo)
                if (surpriseQueue.length === 0) {
                    surpriseQueue = shuffle([...masterFrameList]);
                }

                // 2. Obtener el siguiente frame de la cola (y lo elimina)
                const randomFrame = surpriseQueue.pop();
                gifElement.src = randomFrame; 
                
                // 3. Incrementar el contador total de frames mostrados
                totalFramesShown++; 
                
                // 4. Detener sonidos y actualizar estado
                gifLoopSound.pause();
                gifLoopSound.currentTime = 0; 
                sonidoClic.currentTime = 0;
                sonidoClic.play().catch(error => console.error('Error al reproducir sonido de clic:', error));
                
                estaAnimando = false;
            }
        }
    });
</script>
</body>
</html>
